
name: Actualizar datos de Bitcoin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Comprobar hora de inicio
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Programación: ${{ github.event.schedule }}"
          echo "Inicio real:"
          date -u

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener datos de BTC
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python btc_monitor.py

      - name: Consultar consumo de CoinGecko
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://api.coingecko.com/api/v3/key"
          headers = {
            "x-cg-demo-api-key": os.environ["COINGECKO_API_KEY"]
          }

          respuesta = requests.get(url, headers=headers, timeout=20)

          print("Estado HTTP:", respuesta.status_code)
          print("Respuesta CoinGecko:")
          print(respuesta.text)
          PY

      - name: Guardar CSV en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_dominance.csv btc_dominance_historico.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de BTC"
            git push
          fi
