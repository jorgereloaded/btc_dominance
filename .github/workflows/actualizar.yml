name: Actualizar datos de Bitcoin

on:
  schedule:
- cron: "*/5 * * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener datos de BTC
        run: python btc_monitor.py

      - name: Guardar CSV en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_dominance.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de BTC"
            git push
          fi

# Reactivar la programación automática
