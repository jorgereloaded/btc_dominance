      - name: Identificar contratos BTC en Coinalyze
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          headers = {"api_key": os.environ["COINALYZE_API_KEY"]}

          # Obtener contratos perpetuos de BTC
          url = "https://api.coinalyze.net/v1/future-markets"
          respuesta = requests.get(url, headers=headers, timeout=30)

          print("Estado HTTP Coinalyze:", respuesta.status_code)
          respuesta.raise_for_status()

          mercados = respuesta.json()

          btc = [
              m for m in mercados
              if m.get("base_asset") == "BTC"
              and m.get("is_perpetual") is True
          ]

          btc.sort(key=lambda m: m.get("exchange", ""))

          print("Contratos perpetuos BTC encontrados:", len(btc))

          for m in btc:
              print(
                  m.get("exchange"),
                  "|", m.get("symbol"),
                  "|", m.get("quote_asset"),
                  "|", m.get("margined")
              )

          # Obtener nombres de los exchanges
          print("\n--- NOMBRES DE LOS EXCHANGES ---")

          url = "https://api.coinalyze.net/v1/exchanges"
          respuesta = requests.get(url, headers=headers, timeout=30)

          print("Estado HTTP exchanges:", respuesta.status_code)
          respuesta.raise_for_status()

          for exchange in respuesta.json():
              print(
                  exchange.get("code"),
                  "|", exchange.get("name")
              )
          PY
